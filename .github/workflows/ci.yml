name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out app
        uses: actions/checkout@v5

      # While the library repo is private this needs an FFAPI_REPO_TOKEN secret (a fine-grained
      # token with read access to GhostTypes/ff-5mp-api-kt). Once it is public, the default token works.
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          ffapi-token: ${{ secrets.FFAPI_REPO_TOKEN || github.token }}

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
